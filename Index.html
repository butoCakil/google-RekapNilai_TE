<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RekapNilai TE — Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('AppCSS') ?>
  <style>
    body{display:grid;place-items:center;min-height:100vh;padding:24px}
    .wrap{width:100%;max-width:460px}
    .hero{text-align:center;color:#fff;margin-bottom:22px}
    .hero .logo-xl{width:66px;height:66px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;
      font-size:32px;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:var(--sh-lg)}
    .hero h1{font-size:24px;font-weight:800}
    .hero p{color:#c7c9f5;font-size:13.5px;margin-top:4px}
    .pick{display:grid;gap:12px}
    .pick a{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:var(--r);
      box-shadow:var(--sh);padding:18px;text-decoration:none;color:var(--ink);transition:.15s}
    .pick a:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
    .pick .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
    .pick .ic.g{background:#ede9fe}.pick .ic.s{background:#dcfce7}
    .pick b{font-size:15px}.pick span{font-size:12.5px;color:var(--ink-soft)}
    .legacy{text-align:center;margin-top:18px}
    .legacy input{margin-top:8px}
    .foot{text-align:center;color:#9aa0d6;font-size:11.5px;margin-top:22px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="logo-xl">🎓</div>
      <h1>RekapNilai TE</h1>
      <p>SMK Negeri Bansari — Teknik Elektronika</p>
    </div>

    <div class="pick">
      <a href="#" onclick="masuk('guru');return false;">
        <div class="ic g">🧑‍🏫</div>
        <div><b>Masuk sebagai Guru</b><br><span>Buat tugas, koreksi, pantau kelas</span></div>
      </a>
      <a href="#" onclick="masuk('loginTugas');return false;">
        <div class="ic s">🎒</div>
        <div><b>Masuk sebagai Siswa</b><br><span>Kumpulkan tugas & lihat perjalanan belajarmu</span></div>
      </a>
    </div>

    <div class="panel legacy" style="margin-top:16px">
      <div class="small muted" style="font-weight:700">Portal nilai rapor (lama)</div>
      <input class="input" id="nis" placeholder="Masukkan NIS" onkeydown="if(event.key==='Enter')cekNilai()">
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="cekNilai()">Cek nilai rapor</button>
      <div class="small" id="err" style="color:var(--rose);margin-top:6px;display:none"></div>
    </div>

    <div class="foot">RekapNilai TE © SMK Negeri Bansari</div>
  </div>

  <script>
    function base(){ return google.script.run; }
    function masuk(page){
      google.script.run.withSuccessHandler(function(url){ top.location.href = url + '?page=' + page; }).getScriptUrl();
    }
    function cekNilai(){
      var nis = document.getElementById('nis').value.trim();
      var err = document.getElementById('err');
      if(!nis){ err.textContent = 'NIS tidak boleh kosong'; err.style.display = 'block'; return; }
      google.script.run.withSuccessHandler(function(s){
        if(!s){ err.textContent = 'NIS tidak ditemukan'; err.style.display = 'block'; return; }
        google.script.run.withSuccessHandler(function(url){ top.location.href = url + '?page=siswa&nis=' + encodeURIComponent(nis); }).getScriptUrl();
      }).getSiswaByNis(nis);
    }
  </script>
</body>
</html>
