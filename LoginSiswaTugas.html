<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('AppCSS') ?>
  <style>
    body{display:grid;place-items:center;min-height:100vh;padding:24px}
    .card-login{width:100%;max-width:380px;background:var(--panel);border-radius:var(--r-lg);
      box-shadow:var(--sh-lg);padding:34px 30px}
    .badge-top{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:var(--sh);margin-bottom:16px}
    h1{font-size:21px;font-weight:800}
    .sub{font-size:13px;color:var(--ink-soft);margin:2px 0 22px}
    .err{font-size:13px;color:var(--rose);margin:-6px 0 12px;display:none}
  </style>
</head>
<body>
  <div class="card-login">
    <div class="badge-top">🎒</div>
    <h1>Portal Tugas Siswa</h1>
    <div class="sub">Teknik Elektronika · SMK Negeri Bansari</div>

    <div class="err" id="err"></div>

    <div class="field"><label class="f">NIS</label>
      <input class="input" id="nis" inputmode="numeric" maxlength="4" placeholder="4 digit" autocomplete="off"></div>
    <div class="field"><label class="f">Password</label>
      <input class="input" id="pw" type="password" autocomplete="off"></div>

    <button class="btn btn-primary" id="btn" style="width:100%;margin-top:18px" onclick="login()">Masuk</button>
    <div style="text-align:center;margin-top:14px">
      <a href="<?= scriptUrl ?>" style="font-size:12.5px;color:var(--ink-soft)">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    var SCRIPT_URL = '<?= scriptUrl ?>';
    function login(){
      var nis = document.getElementById('nis').value.trim();
      var pw = document.getElementById('pw').value;
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      err.style.display = 'none';
      if(!nis || !pw){ err.textContent = 'NIS dan password wajib diisi'; err.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Memeriksa…';
      google.script.run
        .withSuccessHandler(function(r){
          if(r.sukses){ top.location.href = SCRIPT_URL + '?page=tugas&token=' + r.token; }
          else { err.textContent = r.pesan; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Masuk'; }
        })
        .withFailureHandler(function(e){
          err.textContent = 'Kesalahan: ' + e.message; err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Masuk';
        })
        .loginSiswaTugas(nis, pw);
    }
    document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
  </script>
</body>
</html>
