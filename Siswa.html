<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nilai Rapor Siswa — TE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('AppCSS') ?>
  <style>
    .mapel-card{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
    .mapel-card .kode{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
      padding:2px 8px;font-weight:800;font-size:12px;color:var(--brand-ink)}
    .komp{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
    .komp div{font-size:12.5px;color:var(--ink-soft)}
    .komp b{display:block;font-size:16px;color:var(--ink)}
    .akhir{font-size:30px;font-weight:800;color:var(--brand-ink);line-height:1}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">📗</span> <span>Nilai Rapor</span></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="kembali()">← Kembali</button>
  </div>

  <div class="app">
    <div id="view"><div class="loading"><div class="spinner"></div>Memuat nilai…</div></div>
  </div>

  <script>
    var NIS = '<?= nis ?>';
    function kembali(){ if(history.length > 1) history.back(); else google.script.run.withSuccessHandler(function(u){ top.location.href = u; }).getScriptUrl(); }

    if(!NIS){ kembali(); }
    else {
      google.script.run.withSuccessHandler(function(siswa){
        if(!siswa){ document.getElementById('view').innerHTML = '<div class="empty">NIS tidak ditemukan.</div>'; return; }
        google.script.run.withSuccessHandler(function(list){ render(siswa, list || []); })
          .withFailureHandler(function(e){ document.getElementById('view').innerHTML = '<div class="empty">Gagal memuat: ' + e.message + '</div>'; })
          .getNilaiByNis(NIS);
      }).getSiswaByNis(NIS);
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

    function render(siswa, list){
      var sudah = list.filter(function(n){ return n.status === 'sudah'; });
      var angka = sudah.map(function(n){ return parseFloat(n.nilaiAkhir); }).filter(function(v){ return !isNaN(v); });
      var rata = angka.length ? Math.round(angka.reduce(function(a, b){ return a + b; }, 0) / angka.length * 100) / 100 : null;

      var hero = '<div class="hero-xp"><div class="level-badge"><b>' + (rata == null ? '–' : rata) + '</b><span>RATA</span></div>' +
        '<div class="xp-wrap"><strong style="font-size:16px">' + esc(siswa.nama) + '</strong>' +
        '<div class="pill-row"><span class="pill">🎓 ' + esc(siswa.kelas) + '</span><span class="pill">🆔 ' + esc(siswa.nis) + '</span>' +
        '<span class="pill">📚 ' + sudah.length + '/' + list.length + ' mapel dinilai</span></div></div></div>';

      var cards = list.map(function(n){
        var s = n.status === 'sudah';
        return '<div class="mapel-card"><div class="row-between"><div><span class="kode">' + esc(n.kode) + '</span> ' +
          '<div style="font-weight:700;font-size:13.5px;margin-top:6px;max-width:520px">' + esc(n.mapel) + '</div></div>' +
          (s ? '<div style="text-align:right"><div class="akhir">' + esc(n.nilaiAkhir) + '</div>' +
               '<div class="small muted">nilai akhir</div></div>'
             : '<span class="st belum">Belum dinilai</span>') + '</div>' +
          (s ? '<div class="komp">' +
                '<div>Harian <b>' + esc(n.harian) + '</b><span class="small muted"> (' + n.bobot.harian + '%)</span></div>' +
                '<div>Praktik <b>' + esc(n.praktik) + '</b><span class="small muted"> (' + n.bobot.praktik + '%)</span></div>' +
                '<div>Project <b>' + esc(n.project) + '</b><span class="small muted"> (' + n.bobot.project + '%)</span></div>' +
               '</div>' + (n.tglInput && n.tglInput !== '-' ? '<div class="small muted" style="margin-top:8px">Diinput: ' + esc(n.tglInput) + '</div>' : '')
             : '') +
          '</div>';
      }).join('');

      document.getElementById('view').innerHTML = hero +
        '<div class="panel" style="margin-top:18px"><div class="section-title">📋 Rekap Nilai per Mapel</div>' +
        '<div class="grid" style="gap:12px">' + (cards || '<div class="empty">Belum ada data nilai.</div>') + '</div></div>';
    }
  </script>
</body>
</html>
