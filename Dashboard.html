<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input Nilai Rapor — Guru TE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('AppCSS') ?>
  <style>
    .nilai-input{width:66px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-weight:700}
    .nilai-input:focus{outline:none;border-color:var(--brand)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">📝</span> <span>Input Nilai Rapor</span></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="kePortal()">🗂️ Portal Tugas</button>
    <div class="chip-user"><span id="namaGuru">…</span><span class="avatar" id="av">?</span></div>
  </div>

  <div class="app">
    <div id="notif" class="card-flat" style="display:none;margin-bottom:14px"></div>

    <div class="panel">
      <div class="section-title">📚 Mapel Anda</div>
      <div id="infoMapel" class="muted">Memuat…</div>
      <div id="infoBobot" class="small muted" style="margin-top:4px"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="section-title">🏫 Pilih Kelas</div>
      <select class="input" id="selectKelas" style="max-width:280px" onchange="loadSiswa()">
        <option value="">— pilih kelas —</option>
      </select>
    </div>

    <div class="panel" id="cardNilai" style="display:none;margin-top:16px">
      <div class="section-title">✏️ Input Nilai</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>#</th><th>NIS</th><th>Nama</th><th>Harian</th><th>Praktik</th><th>Project</th><th>Akhir</th><th>Status</th><th></th></tr></thead>
        <tbody id="tabelSiswa"><tr><td colspan="9" class="muted" style="text-align:center;padding:20px">Pilih kelas dulu</td></tr></tbody>
      </table></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="section-title">⚙️ Bobot Nilai</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div><label class="f">Harian %</label><input class="input" style="width:100px" type="number" id="bobotHarian" min="0" max="100" value="40"></div>
        <div><label class="f">Praktik %</label><input class="input" style="width:100px" type="number" id="bobotPraktik" min="0" max="100" value="40"></div>
        <div><label class="f">Project %</label><input class="input" style="width:100px" type="number" id="bobotProject" min="0" max="100" value="20"></div>
        <button class="btn btn-primary" onclick="simpanBobot()">Simpan bobot</button>
      </div>
      <p class="small muted" style="margin-top:8px">Total harus = 100%.</p>
    </div>
  </div>

  <script>
    var guruData = null, mapelData = null;
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
    function kePortal(){ google.script.run.withSuccessHandler(function(u){ top.location.href = u + '?page=guru'; }).getScriptUrl(); }

    window.onload = function(){
      google.script.run.withSuccessHandler(function(guru){
        if(!guru){ google.script.run.withSuccessHandler(function(u){ top.location.href = u; }).getScriptUrl(); return; }
        guruData = guru;
        document.getElementById('namaGuru').textContent = guru.nama;
        document.getElementById('av').textContent = (guru.nama || '?').charAt(0).toUpperCase();
        loadMapelGuru(); loadKelas();
      }).getUserInfo();
    };

    function loadMapelGuru(){
      google.script.run.withSuccessHandler(function(m){
        if(!m){ document.getElementById('infoMapel').textContent = 'Mapel belum dikonfigurasi.'; return; }
        mapelData = m;
        document.getElementById('infoMapel').innerHTML = '<b>' + esc(m.nama) + '</b> <span class="tag">' + esc(m.kode) + '</span>';
        document.getElementById('infoBobot').textContent = 'Bobot — Harian ' + m.bobotHarian + '% · Praktik ' + m.bobotPraktik + '% · Project ' + m.bobotProject + '%';
        document.getElementById('bobotHarian').value = m.bobotHarian;
        document.getElementById('bobotPraktik').value = m.bobotPraktik;
        document.getElementById('bobotProject').value = m.bobotProject;
      }).getMapelGuru(guruData.nip);
    }

    function loadKelas(){
      google.script.run.withSuccessHandler(function(list){
        var sel = document.getElementById('selectKelas');
        (list || []).forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
      }).getDataKelas();
    }

    function loadSiswa(){
      var kelas = document.getElementById('selectKelas').value;
      if(!kelas) return;
      document.getElementById('cardNilai').style.display = 'block';
      var tb = document.getElementById('tabelSiswa');
      tb.innerHTML = '<tr><td colspan="9" class="muted" style="text-align:center;padding:20px">Memuat…</td></tr>';
      google.script.run.withSuccessHandler(function(nilaiList){
        google.script.run.withSuccessHandler(function(siswa){ renderTabel(siswa || [], nilaiList || []); })
          .getDataSiswaByKelas(kelas);
      }).getNilaiSiswa(mapelData ? mapelData.kode : '', kelas);
    }

    function renderTabel(siswa, nilaiList){
      var tb = document.getElementById('tabelSiswa');
      if(!siswa.length){ tb.innerHTML = '<tr><td colspan="9" class="muted" style="text-align:center;padding:20px">Tidak ada siswa.</td></tr>'; return; }
      tb.innerHTML = '';
      siswa.forEach(function(s, i){
        var ex = nilaiList.find(function(n){ return String(n.nis) === String(s.nis); });
        var sudah = !!ex;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (i + 1) + '</td><td>' + esc(s.nis) + '</td><td>' + esc(s.nama) + '</td>' +
          '<td><input class="nilai-input" type="number" id="h_' + s.nis + '" min="0" max="100" value="' + (sudah ? ex.harian : '') + '" oninput="hit(\'' + s.nis + '\')"></td>' +
          '<td><input class="nilai-input" type="number" id="p_' + s.nis + '" min="0" max="100" value="' + (sudah ? ex.praktik : '') + '" oninput="hit(\'' + s.nis + '\')"></td>' +
          '<td><input class="nilai-input" type="number" id="j_' + s.nis + '" min="0" max="100" value="' + (sudah ? ex.project : '') + '" oninput="hit(\'' + s.nis + '\')"></td>' +
          '<td id="akhir_' + s.nis + '" style="font-weight:800">' + (sudah ? ex.nilaiAkhir : '–') + '</td>' +
          '<td><span class="st ' + (sudah ? 'dinilai' : 'belum') + '">' + (sudah ? 'Sudah' : 'Belum') + '</span></td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="simpanNilai(\'' + esc(s.nis) + '\',\'' + esc(s.nama) + '\',\'' + esc(s.kelas) + '\')">Simpan</button></td>';
        tb.appendChild(tr);
      });
    }

    function hit(nis){
      if(!mapelData) return;
      var h = parseFloat(document.getElementById('h_' + nis).value) || 0;
      var p = parseFloat(document.getElementById('p_' + nis).value) || 0;
      var j = parseFloat(document.getElementById('j_' + nis).value) || 0;
      var akhir = (h * mapelData.bobotHarian / 100 + p * mapelData.bobotPraktik / 100 + j * mapelData.bobotProject / 100).toFixed(2);
      document.getElementById('akhir_' + nis).textContent = akhir;
    }

    function simpanNilai(nis, nama, kelas){
      google.script.run.withSuccessHandler(function(r){
        tampilNotif(r.sukses ? '✅ Nilai ' + nama + ' tersimpan (akhir ' + r.nilaiAkhir + ')' : '❌ ' + r.pesan, r.sukses);
        if(r.sukses) loadSiswa();
      }).simpanNilai({
        nis: nis, nama: nama, kelas: kelas,
        harian: document.getElementById('h_' + nis).value,
        praktik: document.getElementById('p_' + nis).value,
        project: document.getElementById('j_' + nis).value
      });
    }

    function simpanBobot(){
      google.script.run.withSuccessHandler(function(r){
        tampilNotif(r.sukses ? '✅ Bobot diperbarui' : '❌ ' + r.pesan, r.sukses);
        if(r.sukses) loadMapelGuru();
      }).updateBobot(document.getElementById('bobotHarian').value, document.getElementById('bobotPraktik').value, document.getElementById('bobotProject').value);
    }

    function tampilNotif(msg, ok){
      var el = document.getElementById('notif');
      el.textContent = msg;
      el.style.display = 'block';
      el.style.borderColor = ok ? '#86efac' : '#fca5a5';
      el.style.background = ok ? '#f0fdf4' : '#fef2f2';
      setTimeout(function(){ el.style.display = 'none'; }, 4000);
    }
  </script>
</body>
</html>
