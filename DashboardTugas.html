<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16241F;
      --surface: #F4F7F5;
      --surface-card: #FFFFFF;
      --green: #1F6F4A;
      --green-dark: #164F35;
      --copper: #C87941;
      --amber: #D9922B;
      --danger: #C0463C;
      --slate: #5B6B66;
      --border: #DCE5DF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--surface);
      color: var(--ink);
    }
    header {
      background: var(--green);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .nama { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .lonceng {
      position: relative;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
    }
    .badge-notif {
      position: absolute;
      top: -2px; right: -2px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }
    main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

    .progres {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .progres-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--slate);
      margin-bottom: 8px;
    }
    .jalur { display: flex; align-items: center; gap: 2px; }
    .node { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .node.selesai { background: var(--green); }
    .node.menunggu { background: var(--amber); }
    .node.revisi { background: var(--danger); }
    .garis { flex: 1; height: 2px; background: var(--border); }

    .kartu-tugas {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--slate);
      border-radius: 4px;
      padding: 16px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .kartu-tugas:hover { box-shadow: 0 2px 10px rgba(22,36,31,0.08); }
    .kartu-tugas.selesai { border-left-color: var(--green); }
    .kartu-tugas.menunggu { border-left-color: var(--amber); }
    .kartu-tugas.revisi { border-left-color: var(--danger); }

    .baris-atas { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .judul-tugas { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .status-pill {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
      background: #EEF2F0;
      color: var(--slate);
    }
    .status-pill.selesai { background: #E4F3EA; color: var(--green-dark); }
    .status-pill.menunggu { background: #FBF0DD; color: var(--amber); }
    .status-pill.revisi { background: #FAE7E5; color: var(--danger); }

    .meta-tugas { font-size: 12px; color: var(--slate); margin-top: 6px; }
    .nilai-tugas {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      color: var(--green-dark);
    }
    .kosong { text-align: center; color: var(--slate); font-size: 13px; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Portal Tugas</h1>
      <div class="nama"><?= nama ?> &middot; <?= kelas ?></div>
    </div>
    <div class="lonceng" onclick="top.location.href='<?= scriptUrl ?>?page=notifikasiTugas&token=<?= token ?>'">
      &#128276;
      <span class="badge-notif" id="badgeNotif">0</span>
    </div>
  </header>

  <main>
    <div class="progres">
      <div class="progres-label">PROGRES TUGAS</div>
      <div class="jalur" id="jalurProgres"></div>
    </div>

    <div id="daftarTugas">
      <div class="kosong">Memuat daftar tugas...</div>
    </div>
  </main>

  <script>
    const TOKEN = '<?= token ?>';
    const NIS = '<?= nis ?>';
    const SCRIPT_URL = '<?= scriptUrl ?>';

    function statusKeKelas(status) {
      if (status === 'Dinilai') return 'selesai';
      if (status === 'Menunggu Penilaian') return 'menunggu';
      if (status === 'Revisi') return 'revisi';
      return '';
    }

    function formatTanggal(nilai) {
      const d = new Date(nilai);
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function render(daftarTugas) {
      const jalur = document.getElementById('jalurProgres');
      jalur.innerHTML = '';
      daftarTugas.forEach(function (t, i) {
        const node = document.createElement('div');
        node.className = 'node ' + statusKeKelas(t.status);
        jalur.appendChild(node);
        if (i < daftarTugas.length - 1) {
          const garis = document.createElement('div');
          garis.className = 'garis';
          jalur.appendChild(garis);
        }
      });

      const kontainer = document.getElementById('daftarTugas');
      if (!daftarTugas.length) {
        kontainer.innerHTML = '<div class="kosong">Belum ada tugas untuk kelas Anda.</div>';
        return;
      }

      kontainer.innerHTML = '';
      daftarTugas.forEach(function (t) {
        const kelas = statusKeKelas(t.status);
        const div = document.createElement('div');
        div.className = 'kartu-tugas ' + kelas;
        div.onclick = function () {
          top.location.href = SCRIPT_URL + '?page=detailTugas&token=' + TOKEN + '&id=' + t.tugasId;
        };

        let nilaiHtml = '';
        if (t.submisi && t.submisi.status === 'Dinilai') {
          nilaiHtml = '<div class="nilai-tugas">' + t.submisi.nilaiHuruf + ' &middot; ' + t.submisi.nilaiAngka + '</div>';
        }

        div.innerHTML =
          '<div class="baris-atas">' +
            '<div class="judul-tugas"></div>' +
            '<div class="status-pill ' + kelas + '">' + t.status + '</div>' +
          '</div>' +
          '<div class="meta-tugas">Deadline: ' + formatTanggal(t.deadline) + '</div>' +
          nilaiHtml;

        div.querySelector('.judul-tugas').textContent = t.judul;
        kontainer.appendChild(div);
      });
    }

    function muat() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function (err) {
          document.getElementById('daftarTugas').innerHTML =
            '<div class="kosong">Gagal memuat: ' + err.message + '</div>';
        })
        .getDashboardSiswa(NIS);

      google.script.run
        .withSuccessHandler(function (jumlah) {
          if (jumlah > 0) {
            const badge = document.getElementById('badgeNotif');
            badge.textContent = jumlah;
            badge.style.display = 'flex';
          }
        })
        .getJumlahNotifikasiBelumDibaca(NIS);
    }

    muat();
  </script>
</body>
</html>
